<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MFA 管理{% endblock %}</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --ink:#1f2933;
            --muted:#66707d; --blue:#2563eb; --red:#dc2626; --green:#16a34a; --amber:#d97706; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
           background:var(--bg); color:var(--ink); font-size:15px; }
    header { background:var(--card); border-bottom:1px solid var(--line);
             padding:12px 24px; display:flex; align-items:center; gap:18px; }
    header nav a { color:var(--muted); text-decoration:none; margin-right:14px; }
    header nav a:hover { color:var(--blue); }
    main { max-width:960px; margin:28px auto; padding:0 20px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
            padding:20px 22px; margin-bottom:18px; }
    h1 { font-size:20px; margin:0 0 14px; } h2 { font-size:16px; margin:0 0 10px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-weight:600; }
    .muted { color:var(--muted); } code { background:#f1f3f5; padding:2px 6px; border-radius:5px; }
    .flash { padding:10px 14px; border-radius:8px; margin-bottom:12px; font-size:14px; }
    .flash.success { background:#ecfdf3; color:var(--green); }
    .flash.danger  { background:#fef2f2; color:var(--red); }
    .flash.warning { background:#fffbeb; color:var(--amber); }
    .flash.info    { background:#eff6ff; color:var(--blue); }
    label { display:block; margin:10px 0 4px; color:var(--muted); font-size:13px; }
    input { width:100%; max-width:340px; padding:9px 11px; border:1px solid var(--line);
            border-radius:8px; font-size:15px; }
    button, .btn { display:inline-block; background:var(--blue); color:#fff; border:0;
            border-radius:8px; padding:9px 16px; font-size:14px; cursor:pointer; text-decoration:none; }
    button.secondary, .btn.secondary { background:#fff; color:var(--ink); border:1px solid var(--line); }
    button.danger { background:var(--red); }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; }
    .pill.ok { background:#ecfdf3; color:var(--green); }
    .pill.pending { background:#fffbeb; color:var(--amber); }
    .pill.lock { background:#fef2f2; color:var(--red); }
    .codes { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px;
             line-height:1.9; letter-spacing:1px; }
    .pager a { margin-right:10px; }
  </style>
</head>
<body>
<header>
  <strong>MFA 控制台</strong>
  <nav>
    <a href="{{ url_for('mfa.overview') }}">我的设备</a>
    <a href="{{ url_for('mfa.backup_codes') }}">备用码</a>
    <a href="{{ url_for('mfa.recovery') }}">换绑恢复</a>
    {% if session.get('user_id') %}
      <a href="{{ url_for('admin.index') }}">管理</a>
      <a href="{{ url_for('admin.audit') }}">审计</a>
    {% endif %}
  </nav>
  <div style="margin-left:auto" class="muted">
    {% if session.get('user_id') %}
      <form method="post" action="{{ url_for('auth.logout') }}" style="display:inline">
        <button class="secondary" type="submit">退出</button>
      </form>
    {% endif %}
  </div>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="flash {{ category }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
