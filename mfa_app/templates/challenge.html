{% extends "base.html" %}
{% block title %}MFA 验证{% endblock %}
{% block content %}
<div class="card">
  <h1>输入动态验证码</h1>
  <p class="muted">请输入认证器 App 中的 6 位 TOTP 码，或一个备用码。同一验证码只能使用一次。</p>
  <form method="post">
    <label>验证码 / 备用码</label>
    <input name="code" autocomplete="one-time-code" required autofocus>
    <p><button type="submit">验证</button></p>
  </form>
</div>
{% endblock %}
