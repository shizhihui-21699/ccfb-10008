{% extends "base.html" %}
{% block title %}确认绑定{% endblock %}
{% block content %}
<div class="card">
  <h1>扫描二维码 / 录入密钥</h1>
  <p>在认证器 App 中手动录入以下 base32 密钥（或通过 otpauth 链接导入）：</p>
  <p><code style="font-size:17px">{{ pending.secret }}</code></p>
  <p class="muted" style="word-break:break-all">{{ pending.uri }}</p>
  <form method="post" action="{{ url_for('mfa.enroll_confirm', device_id=pending.device_id) }}">
    <label>输入 App 当前显示的 6 位验证码</label>
    <input name="code" autocomplete="one-time-code" required autofocus>
    <p><button type="submit">确认绑定</button></p>
  </form>
</div>
{% endblock %}
